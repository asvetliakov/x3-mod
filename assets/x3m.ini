; X3 Modern Renderer 0.4.0: settings file x3m.ini (schema 2026-09-26).
;
; Put this file next to d3d9.dll in the game folder (the folder with X3AP.exe). The mod works without it:
; every setting below is commented out (the ";" in front) and shows the value the mod uses anyway.
; To change a setting, delete the ";" at the start of its line and edit the value after "=".
; To go back to the default, put the ";" back or delete the line.
;
; The log file x3m.log (next to d3d9.dll) lists which settings this file changed and any line it could not
; use. The [sections] only group the settings; a setting works in any section.

[graphics]
; Temporal anti-aliasing. Smooths edges and flicker by blending each frame with the previous ones.
; 1 = on, 0 = off. Needs hdr = 1 for the full effect. Costs some frame rate.
;taa = 1

; How much of the previous frames the anti-aliasing keeps. Higher is smoother but moving objects leave
; slightly longer trails. 0.5 to 0.98.
; Needs: taa.
;taa_history_weight = 0.9

; Sharpening applied after the anti-aliasing, against its slight softness. 0 = none, 1 = strongest.
; Needs: taa.
;taa_sharpen = 0.75

; Texture detail while the anti-aliasing is on. Negative values pick sharper texture levels; 0 = the
; game's own choice. -8 to 8.
; Needs: taa.
;taa_mip_bias = -0.5

; Tiny sub-pixel camera shifts every frame that the anti-aliasing turns into extra edge detail.
; 1 = on, 0 = off (the anti-aliasing then only blends).
; Needs: taa.
;motion_jitter = 1

; Calms the shimmer of small distant details (antennas, struts). The first number is how strongly (0.5
; to 0.99); the others tune when it applies. 0 = disabled.
; Needs: taa.
;taa_far_stabiliser = 0.985,0,60,68,0.03,0.25

; Calms the crawling of thin lattices and struts. The first number is how strongly (0.5 to 0.99);
; 0 = disabled.
; Needs: taa.
;taa_thin_region = 0.97,1

; Also calms small lights on thin structures that are brighter than this (in the scene's brightness
; units): lower catches dimmer lights. 0 = off, up to 65000.
; Needs: taa_thin_region, hdr.
;taa_thin_region_emissive = 1

; Lets the bloom glow of see-through effects follow the anti-aliasing. Experimental. 1 = on, 0 = off.
; Needs: taa.
;taa_alpha_history = 0

; Skips drawing model parts smaller than this many pixels on screen, for a higher frame rate in busy
; scenes. 0 = draw everything; up to 64.
;cull_small_parts_px = 4

; Whether weapon bolts are exempt from the small-part skipping above. on = bolts are always drawn,
; off = they are skipped like any small part.
;cull_small_parts_projectiles = on

; Minimum on-screen width and length of weapon bolts in the chase view, in pixels, so distant shots
; stay visible. 0 = the game's own size; the width up to 64, the length up to 256.
; Needs: camera, screen_emission_additive.
;bolt_footprint = 3,12

[hdr]
; High dynamic range rendering: lights brighter than white, automatic exposure and a filmic tone
; curve. 1 = on, 0 = off (the game's original look). Costs some frame rate and video memory.
;hdr = 1

; The tone curve that maps bright light to the screen. agx = filmic (soft highlights), identity = no
; curve.
; Needs: hdr.
;hdr_tonemap = agx

; A colour style on top of the tone curve. none = neutral, golden = warmer, punchy = more contrast and
; saturation.
; Needs: hdr_tonemap.
;hdr_look = none

; How the brightness is chosen. auto = adapts to the scene like an eye, manual = fixed at
; hdr_ev_manual, fixed = no adaptation.
; Needs: hdr.
;hdr_exposure = auto

; Overall brightness correction in exposure stops: +1 is twice as bright, -1 half. -16 to 16.
; Needs: hdr.
;hdr_ev = 0

; The fixed exposure in stops when set (it switches the exposure to manual). Empty = not used. -16 to
; 16.
; Needs: hdr.
;hdr_ev_manual =

; The brightness the automatic exposure aims for; higher is brighter. Above 0, up to 64.
; Needs: hdr.
;hdr_key = 0.18

; The darkest the automatic exposure may go, in stops. -16 to 16.
; Needs: hdr.
;hdr_ev_min = -3

; The brightest the automatic exposure may go, in stops. -16 to 16.
; Needs: hdr.
;hdr_ev_max = 1.3

; Seconds the exposure takes to adapt when the scene gets darker (the view brightens). Above 0, up to
; 60.
; Needs: hdr.
;hdr_adapt_up = 0.4

; Seconds the exposure takes to adapt when the scene gets brighter (the view darkens). Above 0, up to
; 60.
; Needs: hdr.
;hdr_adapt_down = 1.2

; Adds invisible noise to the final image so smooth gradients (nebulae, sky) show no banding. 1 = on,
; 0 = off.
; Needs: hdr.
;hdr_dither = 1

; Glow around bright lights. 1 = on, 0 = off.
; Needs: hdr_tonemap.
;hdr_bloom = 1

; Caps how bright a light may be before it feeds the glow, so a single hot pixel does not flare.
; Lower = subtler glow. Above 0, up to 64.
; Needs: hdr_bloom.
;bloom_source_clamp = 1

; Brightness of engine exhausts, weapon effects and ship guide lights. 1 = the game's own, up to 8.
; Needs: hdr.
;emission_source_gain = 2

; Brightness of weapon bolts and other additive effects above plain white, so they glow. 0 = off, else
; 1 to 8.
; Needs: hdr.
;screen_emission_additive = 2

; Brightness of the lit windows and markings on ship and station hulls. 1 = the game's own, up to 8.
; Needs: hdr.
;hull_lightmap_gain = 4

; A faint light on the dark side of ships and stations, tinted by the local sun. 0 = none (fully
; dark), up to 0.5.
; Needs: hdr.
;original_fill = 0.01

[shadows]
; Sun shadows: the main switch (ships and stations cast shadows from the local sun). 1 = on, 0 = off.
; Costs frame rate and video memory (see the shadow map settings below).
; Needs: hdr, taa.
;sun_shadow_lane = 1

; Draws the shadow casters into the shadow maps; needed for any sun shadow. 1 = on, 0 = off.
;shadow_replay_depth = 1

; Darkens the scene where the shadow maps say it is in shadow. 1 = on, 0 = off.
; Needs: sun_shadow_lane, shadow_replay_depth.
;sun_shadow_apply = 1

; Distances (in game units) at which the five shadow maps hand over to the next one, nearest first.
; Larger numbers push the shadows farther out at lower detail. Five numbers separated by commas, each
; larger than the one before, 50 to 150000; 0 = no sun shadows.
; Needs: shadow_replay_depth.
;shadow_cascades = 250,1500,7500,37500,150000

; Resolution of each of the five shadow maps in pixels, nearest first. Higher is sharper and costs
; video memory and time. 64 to 4096 each; one number applies to every map.
; Needs: shadow_cascades.
;shadow_cascade_sizes = 2048,4096,4096,4096,2048

; How many objects each shadow map may draw per frame, nearest first. Higher shows more shadows in
; busy scenes and costs time. 1 to 4096 each.
; Needs: shadow_cascades.
;shadow_cascade_records = 1024,1024,2048,4096,4096

; Which shadows go first when a map is over its limit. importance = the smallest and farthest,
; submission = whatever the game draws last.
; Needs: shadow_cascades.
;shadow_cascade_drop_order = importance

; Sizes the nearest shadow map to your own ship, as this many times its radius, so big ships keep
; sharp shadows. 0.5 to 8.
; Needs: shadow_cascades.
;shadow_cascade_adaptive_c0 = 1.5

; Lets see-through cut-out parts (grilles, lattices) cast their real shadow shape. 1 = on, 0 = off.
; Needs: shadow_replay_depth.
;shadow_alpha_casters = 1

; Keeps a shadow for a few frames when the game briefly skips drawing its object, against flickering
; shadows. 1 = on, 0 = off.
; Needs: shadow_cascades.
;shadow_caster_retention = 1

; Shadow offset in game units against speckled self-shadowing ("shadow acne"). Higher removes speckles
; but detaches shadows slightly. 0 to 1000.
; Needs: sun_shadow_apply.
;sun_shadow_bias_units = 0.53571875

; Upper limit of the shadow offset, in shadow-map pixels. 1 to 64.
; Needs: sun_shadow_apply.
;sun_shadow_bias_clamp_texels = 20.97152

; Extra shadow offset on surfaces that face away from the sun, in shadow-map pixels. 0 to 8.
; Needs: sun_shadow_apply.
;sun_shadow_bias_slope_texels = 0.2

[fog]
; Volumetric nebula fog that the sun lights and ships cast shadows into, replacing the flat fog cards.
; 1 = on, 0 = the game's own fog. Costs frame rate inside nebulae (fog_march_scale trades it against
; sharpness).
; Needs: taa, hdr, shadow_replay_depth, shadow_cascades.
;volumetric_fog = 1

; Density of the volumetric fog. 0 to 0.1.
; Needs: volumetric_fog.
;volumetric_fog_strength = 0.02

; What happens to the game's own flat fog cards. replace = hidden behind the volumetric fog,
; keep = drawn as well.
; Needs: volumetric_fog.
;volumetric_fog_cards = replace

; Where the fog is. stored = the per-sector fog shapes shipped with the mod (run x3m-regenerate once),
; legacy = an older estimate from the game's fog cards.
; Needs: volumetric_fog.
;volumetric_fog_range = stored

; Resolution of the fog calculation. 4 = quarter resolution (fast), 2 = half resolution (sharper,
; slower).
; Needs: volumetric_fog_range.
;fog_march_scale = 4

; Dust specks near the camera inside fog: count (64 to 8192), size (2 to 16) and streak length (0 to
; 512). A count of 0 turns them off.
; Needs: volumetric_fog_range.
;fog_dust_motes = 1300,3,128

; Largest on-screen size of a dust speck, in pixels. 2 to 64 (raised to the speck size when below it).
; Needs: fog_dust_motes.
;fog_motes_max_px = 8

; Keeps the fog visible while docked. 1 = on, 0 = off.
; Needs: volumetric_fog.
;fog_docked = 1

; Fades the fog in over a few frames after a sector change instead of popping. 1 = on, 0 = off.
; Needs: volumetric_fog_range.
;fog_handover_step = 1

; Fills the fog in right away on the first frames of a new sector. 1 = on, 0 = off.
; Needs: volumetric_fog_range.
;fog_handover_coldfill = 1

; Prepares the next sector's fog while the jump is still under way. 1 = on, 0 = off.
; Needs: volumetric_fog_range.
;fog_handover_prefill = 1

[camera]
; The external (back) view. chase = a smoothly following chase camera, vanilla = the game's own.
;camera = chase

; Field of view in degrees, counted like X4: the horizontal angle on a 16:9 screen, 70 to 100 (the
; same on every screen shape). game = the game's own field of view.
;fov = 90

; How far the chase camera looks down on your ship, in degrees. 0 to 30.
; Needs: camera.
;chase_pitch_down_deg = 0.5

; Where your ship sits on screen in the chase view: 0 = centre, 0.5 = halfway down, negative = above
; centre. -1 to 1.
; Needs: camera.
;chase_offset_y = 0.5

; Distance of the chase camera as a multiple of the game's. Larger = farther back. Above 0, up to 10.
; Needs: camera.
;chase_distance_scale = 1.05

; Keeps your ship the same size on screen in the chase view whatever the field of view. 1 = on,
; 0 = off.
; Needs: camera.
;chase_fov_compensate = 1

; Where the aiming reticle sits in the chase view. forward = where the ship points, centre = the
; screen centre.
; Needs: camera.
;chase_hud_anchor = forward

; Returns to the chase view after a gate jump or jumpdrive. 1 = on, 0 = off.
; Needs: camera.
;chase_view_restore = 1

; Experimental: moves the cockpit-layer scene with the smoothed chase view. 1 = on, 0 = off.
; Needs: camera.
;chase_scene_fix = 0

; The sun's flare fades gradually as a ship or station covers the sun, instead of switching off at
; once. 1 = on, 0 = the game's own.
;sun_occlusion = 1

[window]
; Places the borderless game window over the whole monitor (on a Mac: under the menu bar). 1 = on,
; 0 = the game's own placement.
;window_monitor_rect = 1

; Re-hides the system mouse cursor after switching back to the game, against a second cursor. 1 = on,
; 0 = off.
;cursor_reassert = 0

; Only the Pause key (or a click) ends the pause; other keys and switching windows do not. 1 = on,
; 0 = the game's own.
;pause_key_only = 1

; The game's key code of a rebound pause key (decimal or 0x hex). Empty = the Pause key.
; Needs: pause_key_only.
;pause_key =

[audio]
; Sector music keeps playing where it was across switching windows, saving and pausing, instead of
; restarting. 1 = on, 0 = off.
;music_keep = 1

; Makes speech play when the system lacks the game's speech decoder, by using the standard Windows
; one. Does nothing where speech already works. 1 = on, 0 = off.
;voice_dmo_fallback = 1

[loading]
; Faster loading: reuses the game's file-signature checks instead of repeating them. 1 = on, 0 = off.
;crypt_cache = 1

; Faster loading: reads compressed game files in large chunks. 1 = on, 0 = off.
;gz_buffer = 1

; Faster loading: how game data files are read. fast = the mod's reader, native = the game's own.
;resource_read = fast

; Faster loading: keeps the game's data archives open instead of reopening them. 1 = on, 0 = off.
;dat_handles = 1

; Faster loading: how model outlines are prepared. fast = the mod's method, native = the game's own.
;mesh_adjacency = fast

[engine]
; Faster collision checks with modern processor instructions. 1 = on, 0 = off.
;collide_sat_sse2 = 1

; Faster collision checks: remembers ship pairs that cannot touch. 1 = on, 0 = off.
;collide_memo = 1

; Faster collision checks: a quick box test first. 1 = on, 0 = off.
;collide_box_cull = 1

; Keeps stations' shading correct on their simplified distant models. all = on, record0 = the game's
; own behaviour, off = none.
;lod_occlusion = all

; How Terran stations pick their detail level. size = by their size on screen like every other
; station, distance = the game's own.
;terran_station_lod = size

; Keeps the sun flare visible near the screen centre on wide screens. on or off.
;sun_flare_fix = on

; Fades the lit hull windows on far-away ships and stations, where they would otherwise shimmer. The
; first two numbers say how far: how many game units one screen pixel covers at the object where the
; fade starts and where it ends (larger = farther away); the third is the brightness left beyond that
; (up to hull_lightmap_gain; equal to it = no fade).
; Needs: hull_lightmap_gain.
;light_map_far_fade = 80,220,1

; Experimental: lights up small station parts by a light near the whole station. May leave some
; modules darker. 1 = on, 0 = off.
;point_light_root_admission = 0

[logging]
; Detailed diagnostic log for a bug report: enable, reproduce the problem, send x3m.log. About 8 KB of
; log per frame (about 1.7 GB per hour at 60 fps), so turn it off again afterwards. 1 = on, 0 = off.
; F8 then records a short capture.
;debug = 0

; Performance log and an on-screen frame rate counter (about 0.36 GB of log per hour at 60 fps).
; 1 = on, 0 = off.
;perf = 0

; Frames recorded by one F8 capture (with debug = 1). 0 to 64 (more counts as 64).
; Needs: debug.
;capture_frames = 8

; Writes the log to this file instead of x3m.log next to the mod. Empty = the default.
;log_file =
